# Crawmatic core CI (production-readiness audit §M5, §C2 —
# CORE_PRODUCT_PRODUCTION_READINESS_AUDIT_2026-08-15.md).
#
# Before this workflow existed the tree had no `.github/workflows` at
# all: thousands of unit tests and the two migration/scoping guard
# scripts had no visible enforcement on the canonical branch (M5), and a
# green local run could silently apply to a different SHA than whatever
# was deployed (C2). This is the first CI definition in the repo.
#
# `uv sync --locked --all-packages` is mandatory everywhere, not plain
# `uv sync`: the audit found a plain `uv sync` at the repo root leaves
# every workspace member (apps/*, libs/*) uninstalled, producing 136
# import/collection errors. `--all-packages` is the only reproducible
# bootstrap for this uv workspace.
#
# No lint/type-check job: as of this workflow, no `[tool.ruff]`,
# `[tool.mypy]`, or `[tool.black]` config exists anywhere in the repo
# (checked every `pyproject.toml`) — nothing to run, and the task that
# added this workflow was explicitly told not to introduce a new
# linter. Add a lint job here the day one is actually configured.
name: CI

on:
  push:
  pull_request:

env:
  # uv 0.7.13+ is the version this repo's contributor docs assume
  # (README "Prerequisites"); pin CI to the same line.
  UV_VERSION: "0.7.13"

jobs:
  checks:
    name: checks (locked sync, guards, unit suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # requires-python = ">=3.13,<3.14" (root pyproject.toml) — uv
      # manages/downloads the interpreter itself, no actions/setup-python
      # needed.
      - name: Sync the whole workspace (locked, all packages)
        run: uv sync --locked --all-packages

      # `.env` backs `Settings(env_file=".env")` construction (e.g.
      # `DATABASE_URL`/`ENCRYPTION_KEYS` field validation) that some unit
      # tests exercise even though no live Postgres/Redis is reachable
      # here — the placeholders in `.env.example` are local-dev-only and
      # never point at a real service in this job.
      - name: Seed local env from .env.example
        run: cp .env.example .env

      - name: Single-head migration guard
        run: bash scripts/check_single_head.sh

      - name: Workspace-scoping guard
        run: uv run python scripts/check_workspace_scoping.py

      - name: Unit test suite
        run: uv run pytest tests/unit -q

  rls:
    # Workspace isolation is the single control standing between one
    # merchant's catalog and another's, and until 2026-08-20 it was
    # provisioned by hand and proven by NOTHING: the test existed but was
    # gated behind three pre-provisioned database URLs no environment ever
    # had, so it had never once executed (audit B6). A skipped test is not
    # a passed test.
    #
    # This job gives it the one thing it needed — a real Postgres — and
    # the test does the rest itself: `alembic upgrade head`, then the same
    # `migrate.provision_roles` deploy step production runs (statements
    # from scripts/sql/rls_roles.sql), then the cross-workspace reads.
    # It runs against the service container's OWNER role only as the
    # admin/migration identity; every isolation assertion is made through
    # the derived, non-superuser, NOBYPASSRLS `crawmatic_app` role.
    name: rls (live cross-workspace isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_USER: crawmatic_owner
          POSTGRES_PASSWORD: ownerpw
          POSTGRES_DB: crawmatic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crawmatic_owner -d crawmatic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync the whole workspace (locked, all packages)
        run: uv sync --locked --all-packages

      # Same reason as the `checks` job: `Settings(env_file=".env")` is
      # constructed while resolving AUTH_DATABASE_URL for the two-role
      # assertion. The placeholders never point at a real service.
      - name: Seed local env from .env.example
        run: cp .env.example .env

      # The ONLY URL handed in is the owner/admin one. The two runtime
      # roles are created by the test, through the production deploy step.
      - name: Cross-workspace RLS isolation
        env:
          RLS_TEST_DATABASE_URL: postgresql+psycopg://crawmatic_owner:ownerpw@127.0.0.1:5432/crawmatic
        run: uv run pytest tests/integration/test_rls_cross_workspace.py -v

  tenant-isolation:
    # READY-007 / P0.5. The `rls` job above proves isolation on two
    # hand-picked tables. This one proves it on EVERY relation the
    # reviewed manifest (scripts/rls_table_manifest.txt) classifies as
    # tenant-owned, and on every monthly partition of each of them —
    # because isolation has never failed uniformly here. It failed on
    # the relations nobody enumerated: the eight monthly partitions that
    # carried `workspace_id` with no RLS at all (2026-08-20 review).
    #
    # MANDATORY, and deliberately not `continue-on-error`. The job
    # provisions the three production roles FROM SCRATCH via
    # `scripts/provision_db_roles.sql` against an empty database, so a
    # provisioning script that stops being runnable fails here rather
    # than during a deploy.
    #
    # postgres:18-alpine, not the 17.5 image the `rls` job uses:
    # production runs PostgreSQL 18.x, and role attributes, FORCE RLS
    # and partition policy inheritance are exactly the surface where a
    # major-version difference between CI and production is worth not
    # having.
    name: tenant-isolation (roles provisioned from zero + negative suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: crawmatic_owner
          POSTGRES_PASSWORD: ownerpw
          POSTGRES_DB: crawmatic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crawmatic_owner -d crawmatic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync the whole workspace (locked, all packages)
        run: uv sync --locked --all-packages

      # NO `cp .env.example .env` step, unlike every other job here, and
      # that omission is the point: this suite must never resolve a DSN
      # from `.env`. It takes exactly one URL — the throwaway service
      # container's owner role — and derives the runtime roles itself.
      # If a future edit makes it read `.env`, this job fails.

      - name: Provision the three DB roles from zero
        env:
          PROVISION_DB_ROLES_URL: postgresql+psycopg://crawmatic_owner:ownerpw@127.0.0.1:5432/crawmatic
          MIGRATION_DATABASE_URL: postgresql+psycopg://crawmatic_owner:ownerpw@127.0.0.1:5432/crawmatic
          CRAWMATIC_APP_DB_PASSWORD: ci-app-pw
          CRAWMATIC_AUTH_DB_PASSWORD: ci-auth-pw
          CRAWMATIC_MIGRATE_DB_PASSWORD: ci-migrate-pw
        run: |
          uv run alembic upgrade head
          uv run python scripts/provision_db_roles.py --provision

      # Read-only. Diffs the live catalog against the reviewed manifest
      # in both directions, so a migration that adds a table without
      # annotating it, or drops a policy, fails CI here.
      - name: Verify role + RLS posture against the reviewed manifest
        env:
          PROVISION_DB_ROLES_URL: postgresql+psycopg://crawmatic_owner:ownerpw@127.0.0.1:5432/crawmatic
        run: uv run python scripts/provision_db_roles.py --verify

      - name: Negative tenant-isolation suite (every manifest relation)
        env:
          TENANT_ISOLATION_TEST_DATABASE_URL: postgresql+psycopg://crawmatic_owner:ownerpw@127.0.0.1:5432/crawmatic
        run: uv run pytest tests/integration/test_tenant_isolation_roles.py -v

  dispatch-integrity:
    # READY-002/READY-003/READY-004 (Phase B gate-fix MED-2). Before this job,
    # the B1-B3b dispatch-identity matrix, the domain-certification suite, and
    # the dispatch-stamping guard ran only on a reviewer's own box — nothing
    # enforced them on the canonical branch. Item 2 of
    # tests/integration/test_dispatch_replay_matrix.py is the one item in that
    # matrix that needs a real, isolated Postgres (it asserts
    # `uq_dispatch_intents_identity_key` under two concurrent transactions,
    # something the fake-session items cannot express); without a reachable
    # `B3_SCRATCH_DATABASE_URL` that item skips rather than degrading to a
    # fake, silently downgrading the matrix from 16 items to 15 on any box
    # without the scratch DB — this job is what keeps it running for real.
    #
    # postgres:18-alpine, same version pin as `tenant-isolation` above, for
    # the same reason: production runs PostgreSQL 18.x.
    name: dispatch-integrity (dispatch identity, replay matrix, certification)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: crawmatic_owner
          POSTGRES_PASSWORD: ownerpw
          POSTGRES_DB: crawmatic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crawmatic_owner -d crawmatic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync the whole workspace (locked, all packages)
        run: uv sync --locked --all-packages

      # Same reason as `checks`/`rls`/`compose-smoke`: the dispatch-stamping
      # and certification suites spawn `app.workers`/`app.api` subprocesses
      # that construct `Settings(env_file=".env")`.
      - name: Seed local env from .env.example
        run: cp .env.example .env

      # Item 2 of the replay matrix (`test_dispatch_replay_matrix.py`) is the
      # only test here that touches a real database — it creates and drops
      # its own `scrape_jobs`/`scrape_job_targets`/`dispatch_intents` tables
      # from ORM metadata, so it must only ever reach a throwaway database.
      # Point it at the service container's owner role, never at `.env`'s
      # DSN.
      - name: Dispatch identity, replay matrix and domain certification suites
        env:
          B3_SCRATCH_DATABASE_URL: postgresql+psycopg://crawmatic_owner:ownerpw@127.0.0.1:5432/crawmatic
        run: |
          uv run pytest tests/integration/test_dispatch_stamping.py tests/integration/test_dispatch_replay_matrix.py tests/integration/test_domain_certification.py -q

  images:
    name: images (build every Dockerfile docker-compose.yml references)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: migrate
            dockerfile: apps/migrate/Dockerfile
          - service: scheduler
            dockerfile: apps/scheduler/Dockerfile
          - service: worker
            dockerfile: apps/workers/Dockerfile
          - service: scrapers
            dockerfile: apps/scrapers/Dockerfile
          - service: scrapers-browser
            dockerfile: apps/scrapers-browser/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.9.0

      # Build context is the repo root for every service (each Dockerfile
      # needs the whole uv workspace to resolve — see apps/api/Dockerfile's
      # header comment) — matches `docker-compose.yml`'s `build.context: .`
      # for every service.
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6.13.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: crawmatic-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose-smoke:
    name: compose-smoke (all 8 components reach running/healthy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync the whole workspace (locked, all packages)
        run: uv sync --locked --all-packages

      # Required before ANY `docker compose` invocation against this
      # repo's compose file, CI or local: every service sets
      # `env_file: .env` (a literal relative path baked into
      # docker-compose.yml, not resolved by `docker compose`'s
      # `--env-file` flag, which only affects `${VAR}` interpolation).
      # Skipping this step fails compose config validation on a clean
      # checkout — this is the exact trap the production-readiness audit
      # flagged in §4/§M5.
      - name: Seed .env from .env.example
        run: cp .env.example .env

      - name: Validate compose config
        run: docker compose -f docker-compose.yml config --quiet

      # tests/integration/test_compose_smoke.py drives the full
      # `docker compose up --build -d` / `ps` / teardown lifecycle itself
      # (its own throwaway `--env-file`, separate from the `.env` seeded
      # above) and asserts all 8 components reach running/healthy.
      - name: Compose smoke test
        run: uv run pytest tests/integration/test_compose_smoke.py -v

  # ── Release gate: secret scanning + credential-file check ────────────────
  # EPA task W5.4 (READY-010, P0.8). Before this job the repo had no
  # automated secret detection: the 2026-08-25 residue scan (A3) was a
  # one-off run of a binary downloaded by hand, which catches what exists
  # today and nothing that lands tomorrow.
  #
  # gitleaks is pinned by version AND by sha256. An unpinned `curl | tar`
  # in a job whose whole purpose is supply-chain hygiene would be a joke at
  # its own expense; `gitleaks-action` is deliberately not used because it
  # requires a licence key for organisation accounts.
  #
  # Historical findings are baselined in .gitleaksignore (fingerprints, no
  # values). The tree scan is therefore green on arrival and any NEW finding
  # is a real one. On pull requests the job additionally scans the commits
  # the PR introduces, which catches a secret that was added and then
  # deleted again within the branch — invisible to a tree scan.
  security:
    name: security (secret scan, credential-file gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          # Full history: the pull-request diff scan below needs the base
          # commit, and a shallow clone does not have it.
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          tar xzf "$asset" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan — working tree
        run: |
          gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Secret scan — commits introduced by this pull request
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"

      # Mode `tracked`, not `host`: actions/checkout rewrites every file to
      # 0644, so a permission check on a CI checkout would flag the entire
      # tree and prove nothing. The question CI *can* answer is whether a
      # credential-shaped file is committed at all. The on-disk permission
      # sweep runs on the ops host from /etc/cron.d/crawmatic-dr.
      - name: Credential-file gate (tracked files)
        run: ./scripts/security/check_file_permissions.sh --mode tracked --root .
