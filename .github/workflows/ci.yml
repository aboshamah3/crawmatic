# Crawmatic core CI (production-readiness audit §M5, §C2 —
# CORE_PRODUCT_PRODUCTION_READINESS_AUDIT_2026-08-15.md).
#
# Before this workflow existed the tree had no `.github/workflows` at
# all: thousands of unit tests and the two migration/scoping guard
# scripts had no visible enforcement on the canonical branch (M5), and a
# green local run could silently apply to a different SHA than whatever
# was deployed (C2). This is the first CI definition in the repo.
#
# `uv sync --locked --all-packages` is mandatory everywhere, not plain
# `uv sync`: the audit found a plain `uv sync` at the repo root leaves
# every workspace member (apps/*, libs/*) uninstalled, producing 136
# import/collection errors. `--all-packages` is the only reproducible
# bootstrap for this uv workspace.
#
# No lint/type-check job: as of this workflow, no `[tool.ruff]`,
# `[tool.mypy]`, or `[tool.black]` config exists anywhere in the repo
# (checked every `pyproject.toml`) — nothing to run, and the task that
# added this workflow was explicitly told not to introduce a new
# linter. Add a lint job here the day one is actually configured.
name: CI

on:
  push:
  pull_request:

env:
  # uv 0.7.13+ is the version this repo's contributor docs assume
  # (README "Prerequisites"); pin CI to the same line.
  UV_VERSION: "0.7.13"

jobs:
  checks:
    name: checks (locked sync, guards, unit suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # ── W5.1 clean-tree guard (READY-001, P0.2) ──────────────────────────
      # FIRST, before `uv sync` writes a `.venv` or any step touches the
      # tree. Placed later it would only be measuring this job's own output.
      #
      # This is the guard that makes every artifact downstream mean
      # something: the `images` job below tags by ${{ github.sha }} and the
      # promotion job re-tags that digest WITHOUT rebuilding, so the claim
      # "this image is that commit" rests entirely on the tree having been
      # that commit when the build started.
      - name: Guard — the checkout is exactly the commit
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree is not clean at checkout; refusing to build"
            git status --porcelain
            exit 1
          fi
          echo "clean at ${GITHUB_SHA}"

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # requires-python = ">=3.13,<3.14" (root pyproject.toml) — uv
      # manages/downloads the interpreter itself, no actions/setup-python
      # needed.
      - name: Sync the whole workspace (locked, all packages)
        run: uv sync --locked --all-packages

      # `.env` backs `Settings(env_file=".env")` construction (e.g.
      # `DATABASE_URL`/`ENCRYPTION_KEYS` field validation) that some unit
      # tests exercise even though no live Postgres/Redis is reachable
      # here — the placeholders in `.env.example` are local-dev-only and
      # never point at a real service in this job.
      - name: Seed local env from .env.example
        run: cp .env.example .env

      - name: Single-head migration guard
        run: bash scripts/check_single_head.sh

      - name: Workspace-scoping guard
        run: uv run python scripts/check_workspace_scoping.py

      - name: Unit test suite
        run: uv run pytest tests/unit -q

  # ── W5.1: the engine half of the engine/SaaS contract ───────────────────
  # Its own job, not a step inside `checks`, because a contract breach is a
  # CROSS-REPOSITORY failure: the fix is in the SaaS, or in a coordinated
  # pair of commits, and that has to be legible from the job list rather
  # than excavated from a 3,000-test run.
  #
  # `tests/integration/test_api_contract.py` needs NO database — it
  # introspects the composed FastAPI app (routes, scope gates, response
  # models, the pagination module, the error envelope). Every other file in
  # tests/integration/ skips without live Postgres; this one must never
  # skip, so it runs here on its own where a skip would be visible rather
  # than buried among them.
  #
  # `-p no:randomly` is deliberate: this suite asserts a fixed vocabulary and
  # must produce the same report every run, so a maintainer comparing two
  # runs is comparing the contract and not the ordering.
  contract:
    name: contract (engine/SaaS API contract, no DB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync the whole workspace (locked, all packages)
        run: uv sync --locked --all-packages

      - name: Seed local env from .env.example
        run: cp .env.example .env

      # `--no-skip` has no pytest equivalent, so the skip check is explicit:
      # the run must report zero skipped tests. A contract test that silently
      # stopped running is worse than one that never existed, because the
      # green check keeps being trusted.
      - name: Engine/SaaS API contract (W5.1)
        run: |
          set -euo pipefail
          uv run pytest tests/integration/test_api_contract.py -q -p no:randomly \
            --junitxml=contract-results.xml
          skipped=$(python3 -c "
          import xml.etree.ElementTree as ET
          r = ET.parse('contract-results.xml').getroot()
          s = r if r.tag == 'testsuite' else r.find('testsuite')
          print(s.get('skipped', '0'))
          ")
          if [ "${skipped}" != "0" ]; then
            echo "::error::${skipped} contract test(s) SKIPPED — a skipped contract test is not a passed one"
            exit 1
          fi
          echo "contract: no tests skipped"

  rls:
    # Workspace isolation is the single control standing between one
    # merchant's catalog and another's, and until 2026-08-20 it was
    # provisioned by hand and proven by NOTHING: the test existed but was
    # gated behind three pre-provisioned database URLs no environment ever
    # had, so it had never once executed (audit B6). A skipped test is not
    # a passed test.
    #
    # This job gives it the one thing it needed — a real Postgres — and
    # the test does the rest itself: `alembic upgrade head`, then the same
    # `migrate.provision_roles` deploy step production runs (statements
    # from scripts/sql/rls_roles.sql), then the cross-workspace reads.
    # It runs against the service container's OWNER role only as the
    # admin/migration identity; every isolation assertion is made through
    # the derived, non-superuser, NOBYPASSRLS `crawmatic_app` role.
    name: rls (live cross-workspace isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_USER: crawmatic_owner
          POSTGRES_PASSWORD: ownerpw
          POSTGRES_DB: crawmatic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crawmatic_owner -d crawmatic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync the whole workspace (locked, all packages)
        run: uv sync --locked --all-packages

      # Same reason as the `checks` job: `Settings(env_file=".env")` is
      # constructed while resolving AUTH_DATABASE_URL for the two-role
      # assertion. The placeholders never point at a real service.
      - name: Seed local env from .env.example
        run: cp .env.example .env

      # The ONLY URL handed in is the owner/admin one. The two runtime
      # roles are created by the test, through the production deploy step.
      - name: Cross-workspace RLS isolation
        env:
          RLS_TEST_DATABASE_URL: postgresql+psycopg://crawmatic_owner:ownerpw@127.0.0.1:5432/crawmatic
        run: uv run pytest tests/integration/test_rls_cross_workspace.py -v

  tenant-isolation:
    # READY-007 / P0.5. The `rls` job above proves isolation on two
    # hand-picked tables. This one proves it on EVERY relation the
    # reviewed manifest (scripts/rls_table_manifest.txt) classifies as
    # tenant-owned, and on every monthly partition of each of them —
    # because isolation has never failed uniformly here. It failed on
    # the relations nobody enumerated: the eight monthly partitions that
    # carried `workspace_id` with no RLS at all (2026-08-20 review).
    #
    # MANDATORY, and deliberately not `continue-on-error`. The job
    # provisions the three production roles FROM SCRATCH via
    # `scripts/provision_db_roles.sql` against an empty database, so a
    # provisioning script that stops being runnable fails here rather
    # than during a deploy.
    #
    # postgres:18-alpine, not the 17.5 image the `rls` job uses:
    # production runs PostgreSQL 18.x, and role attributes, FORCE RLS
    # and partition policy inheritance are exactly the surface where a
    # major-version difference between CI and production is worth not
    # having.
    name: tenant-isolation (roles provisioned from zero + negative suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: crawmatic_owner
          POSTGRES_PASSWORD: ownerpw
          POSTGRES_DB: crawmatic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crawmatic_owner -d crawmatic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync the whole workspace (locked, all packages)
        run: uv sync --locked --all-packages

      # NO `cp .env.example .env` step, unlike every other job here, and
      # that omission is the point: this suite must never resolve a DSN
      # from `.env`. It takes exactly one URL — the throwaway service
      # container's owner role — and derives the runtime roles itself.
      # If a future edit makes it read `.env`, this job fails.

      - name: Provision the three DB roles from zero
        env:
          PROVISION_DB_ROLES_URL: postgresql+psycopg://crawmatic_owner:ownerpw@127.0.0.1:5432/crawmatic
          MIGRATION_DATABASE_URL: postgresql+psycopg://crawmatic_owner:ownerpw@127.0.0.1:5432/crawmatic
          CRAWMATIC_APP_DB_PASSWORD: ci-app-pw
          CRAWMATIC_AUTH_DB_PASSWORD: ci-auth-pw
          CRAWMATIC_MIGRATE_DB_PASSWORD: ci-migrate-pw
        run: |
          uv run alembic upgrade head
          uv run python scripts/provision_db_roles.py --provision

      # Read-only. Diffs the live catalog against the reviewed manifest
      # in both directions, so a migration that adds a table without
      # annotating it, or drops a policy, fails CI here.
      - name: Verify role + RLS posture against the reviewed manifest
        env:
          PROVISION_DB_ROLES_URL: postgresql+psycopg://crawmatic_owner:ownerpw@127.0.0.1:5432/crawmatic
        run: uv run python scripts/provision_db_roles.py --verify

      - name: Negative tenant-isolation suite (every manifest relation)
        env:
          TENANT_ISOLATION_TEST_DATABASE_URL: postgresql+psycopg://crawmatic_owner:ownerpw@127.0.0.1:5432/crawmatic
        run: uv run pytest tests/integration/test_tenant_isolation_roles.py -v

  dispatch-integrity:
    # READY-002/READY-003/READY-004 (Phase B gate-fix MED-2). Before this job,
    # the B1-B3b dispatch-identity matrix, the domain-certification suite, and
    # the dispatch-stamping guard ran only on a reviewer's own box — nothing
    # enforced them on the canonical branch. Item 2 of
    # tests/integration/test_dispatch_replay_matrix.py is the one item in that
    # matrix that needs a real, isolated Postgres (it asserts
    # `uq_dispatch_intents_identity_key` under two concurrent transactions,
    # something the fake-session items cannot express); without a reachable
    # `B3_SCRATCH_DATABASE_URL` that item skips rather than degrading to a
    # fake, silently downgrading the matrix from 16 items to 15 on any box
    # without the scratch DB — this job is what keeps it running for real.
    #
    # postgres:18-alpine, same version pin as `tenant-isolation` above, for
    # the same reason: production runs PostgreSQL 18.x.
    name: dispatch-integrity (dispatch identity, replay matrix, certification)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: crawmatic_owner
          POSTGRES_PASSWORD: ownerpw
          POSTGRES_DB: crawmatic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crawmatic_owner -d crawmatic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync the whole workspace (locked, all packages)
        run: uv sync --locked --all-packages

      # Same reason as `checks`/`rls`/`compose-smoke`: the dispatch-stamping
      # and certification suites spawn `app.workers`/`app.api` subprocesses
      # that construct `Settings(env_file=".env")`.
      - name: Seed local env from .env.example
        run: cp .env.example .env

      # Item 2 of the replay matrix (`test_dispatch_replay_matrix.py`) is the
      # only test here that touches a real database — it creates and drops
      # its own `scrape_jobs`/`scrape_job_targets`/`dispatch_intents` tables
      # from ORM metadata, so it must only ever reach a throwaway database.
      # Point it at the service container's owner role, never at `.env`'s
      # DSN.
      - name: Dispatch identity, replay matrix and domain certification suites
        env:
          B3_SCRATCH_DATABASE_URL: postgresql+psycopg://crawmatic_owner:ownerpw@127.0.0.1:5432/crawmatic
        run: |
          uv run pytest tests/integration/test_dispatch_stamping.py tests/integration/test_dispatch_replay_matrix.py tests/integration/test_domain_certification.py -q

  # ── W5.5-GA item A: dependency audit (pip-audit, fail-critical/warn-rest) ──
  # No CI runner exists to have run this before; it is new. `uv export
  # --format cyclonedx1.5` is uv's own, ecosystem-native SBOM emitter (no
  # third-party action needed for the Python side — verified locally
  # 2026-08-26: 104 components from this exact `uv.lock`), so the same job
  # also produces and uploads the CycloneDX SBOM for the locked dependency
  # set. pip-audit's version is pinned (`uvx pip-audit==2.10.1`) for
  # reproducibility — an unpinned "latest" audit tool is itself a supply-
  # chain risk in a job whose purpose is supply-chain hygiene.
  #
  # Severity: pip-audit's OSV-backed JSON report has no reliable
  # cross-ecosystem CVSS field (see scripts/security/pip_audit_gate.py's
  # docstring), so the gate fails ONLY on an advisory id present in the
  # owner-maintained `scripts/security/known_critical_advisories.txt`
  # (seeded empty) and WARNS on everything else via the job summary — never
  # silently dropped. Run against this repo's real locked deps on
  # 2026-08-26 this surfaced 3 genuine, non-critical findings (cryptography
  # 49.0.0, setuptools 80.10.2, pytest 8.4.2 — see the W5.5-GA task report);
  # zero were critical, so the job is green today.
  dependency-audit:
    name: dependency-audit (pip-audit fail-critical/warn-rest + CycloneDX SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync the whole workspace (locked, all packages)
        run: uv sync --locked --all-packages

      - name: Export locked dependencies (requirements + CycloneDX SBOM)
        run: |
          set -euo pipefail
          mkdir -p dist/sbom
          uv export --frozen --all-packages --format requirements.txt --no-hashes \
            -o /tmp/requirements-audit.txt
          uv export --frozen --all-packages --format cyclonedx1.5 \
            -o dist/sbom/engine-python-deps.cdx.json

      - name: Run pip-audit (OSV-backed, network required — CI-only)
        # pip-audit exits 1 the moment it finds ANY vulnerability, which
        # would abort the job before the JSON report (and this step's own
        # exit) reaches the gate script below. `|| true` here is
        # deliberate and safe: pass/fail is decided entirely by the gate
        # script reading the JSON report next, which fails closed
        # (exit 1) if the report is missing or empty — so a genuine
        # pip-audit crash (vs. "found vulnerabilities") still fails the
        # job, just one step later with a clearer error.
        run: |
          uvx pip-audit==2.10.1 -r /tmp/requirements-audit.txt \
            -f json -o /tmp/pip-audit-report.json || true

      - name: Gate on critical advisories, warn on the rest
        run: |
          uv run python scripts/security/pip_audit_gate.py \
            --input /tmp/pip-audit-report.json \
            --allowlist scripts/security/known_critical_advisories.txt \
            --summary-out "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4.4.3
        with:
          name: sbom-engine-python-deps
          path: dist/sbom/engine-python-deps.cdx.json
          if-no-files-found: error
          retention-days: 90

  images:
    name: images (build every Dockerfile docker-compose.yml references)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    # ── W5.5-GA item A: provenance attestation needs OIDC + the
    # attestations API, neither of which is a secret — `id-token: write`
    # lets the runner mint a short-lived OIDC token and `attestations:
    # write` lets `attest-build-provenance` publish to this repo's
    # attestation store. No registry credential is used or required (this
    # job still never pushes, per the `promote` job's own comment above);
    # the attestation is over the local image tarball this job already
    # exports.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: migrate
            dockerfile: apps/migrate/Dockerfile
          - service: scheduler
            dockerfile: apps/scheduler/Dockerfile
          - service: worker
            dockerfile: apps/workers/Dockerfile
          - service: scrapers
            dockerfile: apps/scrapers/Dockerfile
          - service: scrapers-browser
            dockerfile: apps/scrapers-browser/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.9.0

      # Build context is the repo root for every service (each Dockerfile
      # needs the whole uv workspace to resolve — see apps/api/Dockerfile's
      # header comment) — matches `docker-compose.yml`'s `build.context: .`
      # for every service.
      # ── W5.1: build ONCE, identify by digest, never rebuild to promote ────
      # Before this, the job built each image, tagged it `:ci`, and threw it
      # away — so whatever was later deployed had been built a SECOND time,
      # somewhere else, from a tree nobody checked. Two builds of "the same
      # commit" are not the same artifact: base images move, apt mirrors
      # move, and a `pip`/`uv` resolution can differ by the hour.
      #
      # So the image is built once here, exported as a tarball, and its
      # image id (the sha256 of its config, which fixes every layer) is
      # recorded into a build manifest. The `promote` job below re-tags THAT
      # artifact by digest and verifies the id is unchanged. Nothing
      # downstream is permitted to rebuild.
      #
      # `outputs: type=docker,dest=` rather than `load: true` so the artifact
      # is a FILE that can be uploaded and handed to the next job — a loaded
      # image lives only in this runner's daemon and dies with it.
      - name: Build ${{ matrix.service }} image
        id: build
        uses: docker/build-push-action@v6.13.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: crawmatic-${{ matrix.service }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/image-${{ matrix.service }}.tar
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Record ${{ matrix.service }} into the build manifest
        run: |
          set -euo pipefail
          tar_sha="$(sha256sum "/tmp/image-${{ matrix.service }}.tar" | cut -d' ' -f1)"
          cat > "/tmp/manifest-${{ matrix.service }}.json" <<EOF
          {
            "service": "${{ matrix.service }}",
            "dockerfile": "${{ matrix.dockerfile }}",
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "tag": "crawmatic-${{ matrix.service }}:${GITHUB_SHA}",
            "image_id": "${{ steps.build.outputs.imageid }}",
            "digest": "${{ steps.build.outputs.digest }}",
            "artifact_sha256": "${tar_sha}",
            "workflow_run": "${GITHUB_RUN_ID}"
          }
          EOF
          cat "/tmp/manifest-${{ matrix.service }}.json"

      # ── W5.5-GA item A: image SBOM (CycloneDX via syft) ────────────────
      # Pinned by version AND sha256, same discipline as the `security`
      # job's gitleaks install below — a supply-chain-hygiene step must
      # not itself pull an unpinned "latest" binary. Scans the exported
      # tarball directly via syft's `docker-archive:` scheme, so it needs
      # neither a registry pull nor the image loaded into this runner's
      # daemon (which `outputs: type=docker,dest=` deliberately avoids —
      # see the build step's comment above).
      - name: Install syft (pinned + checksum-verified)
        run: |
          set -euo pipefail
          asset="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$asset" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${asset}"
          echo "${SYFT_SHA256}  ${asset}" | sha256sum -c -
          tar xzf "$asset" syft
          sudo install -m 0755 syft /usr/local/bin/syft
          syft version
        env:
          SYFT_VERSION: "1.18.0"
          SYFT_SHA256: "0b6fd1e0dd5b00b19585e5cde8e1c1f4ef60dc8fba8b41fab55f00852a2fbb8d"

      - name: Generate CycloneDX SBOM for ${{ matrix.service }}
        run: |
          set -euo pipefail
          syft "docker-archive:/tmp/image-${{ matrix.service }}.tar" \
            -o cyclonedx-json="/tmp/sbom-${{ matrix.service }}.cdx.json"

      # ── W5.5-GA item A: build provenance attestation ────────────────────
      # No registry credential needed or used (see job `permissions:`
      # above) — this attests the local tarball via GitHub's OIDC-backed
      # Sigstore instance, independent of any push. If Actions' OIDC issuer
      # is ever unreachable this step fails loudly rather than silently
      # skipping; unlike the SBOM step there is no local fallback for
      # provenance (a provenance claim's whole value is coming from a
      # trusted third party — this job — not from the tree being attested).
      - name: Attest build provenance for ${{ matrix.service }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: /tmp/image-${{ matrix.service }}.tar

      - name: Upload ${{ matrix.service }} image + manifest + SBOM
        uses: actions/upload-artifact@v4.4.3
        with:
          name: image-${{ matrix.service }}
          path: |
            /tmp/image-${{ matrix.service }}.tar
            /tmp/manifest-${{ matrix.service }}.json
            /tmp/sbom-${{ matrix.service }}.cdx.json
          if-no-files-found: error
          retention-days: 7

  # ── W5.1: promotion by digest ───────────────────────────────────────────
  # This job is what "tested, then promoted, without rebuilding" means in
  # practice. It NEVER runs `docker build`. It loads the exact tarball the
  # `images` job produced, and fails if the loaded image's id differs by one
  # character from what the manifest recorded.
  #
  # `needs: [images, checks, contract]` is the ordering that makes the claim
  # true: an artifact is only promotable once the suite AND the cross-repo
  # contract have passed on the same commit that produced it.
  #
  # No registry push happens here and none should: pushing needs a
  # credential, and the credential-holding step belongs in a deploy workflow
  # with its own approval, not in CI. What this job establishes is the
  # property a deploy then relies on — that the bytes are identified, tested,
  # and unchanged since the build.
  promote:
    name: promote (re-tag by digest, no rebuild)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [images, checks, contract]
    steps:
      - name: Download every built image
        uses: actions/download-artifact@v4.1.8
        with:
          pattern: image-*
          path: /tmp/artifacts

      - name: Load each image and verify its identity is unchanged
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for manifest in /tmp/artifacts/*/manifest-*.json; do
            found=$((found + 1))
            dir="$(dirname "$manifest")"
            service="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['service'])" "$manifest")"
            recorded_id="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['image_id'])" "$manifest")"
            recorded_tar="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['artifact_sha256'])" "$manifest")"
            tar="${dir}/image-${service}.tar"

            echo "── ${service} ──"

            # 1. The bytes are the bytes that were built.
            echo "${recorded_tar}  ${tar}" | sha256sum -c -

            # 2. Loading does not rebuild; it unpacks. If the id the daemon
            #    reports differs from the recorded one, this is not that
            #    artifact and must not be promoted.
            loaded="$(docker load -q -i "$tar" | sed 's/^Loaded image: //')"
            actual_id="$(docker image inspect --format '{{.Id}}' "$loaded")"
            if [ "${actual_id}" != "${recorded_id}" ]; then
              echo "::error::${service}: loaded image id ${actual_id} != recorded ${recorded_id}"
              exit 1
            fi

            # 3. Promotion IS a re-tag. No build context, no Dockerfile.
            docker tag "${actual_id}" "crawmatic-${service}:promoted-${GITHUB_SHA}"
            echo "${service}: promoted ${actual_id} as crawmatic-${service}:promoted-${GITHUB_SHA}"
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::no image manifests were downloaded — nothing to promote"
            exit 1
          fi
          echo "promoted ${found} image(s) by digest, zero rebuilds"

  compose-smoke:
    name: compose-smoke (all 8 components reach running/healthy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync the whole workspace (locked, all packages)
        run: uv sync --locked --all-packages

      # Required before ANY `docker compose` invocation against this
      # repo's compose file, CI or local: every service sets
      # `env_file: .env` (a literal relative path baked into
      # docker-compose.yml, not resolved by `docker compose`'s
      # `--env-file` flag, which only affects `${VAR}` interpolation).
      # Skipping this step fails compose config validation on a clean
      # checkout — this is the exact trap the production-readiness audit
      # flagged in §4/§M5.
      - name: Seed .env from .env.example
        run: cp .env.example .env

      - name: Validate compose config
        run: docker compose -f docker-compose.yml config --quiet

      # tests/integration/test_compose_smoke.py drives the full
      # `docker compose up --build -d` / `ps` / teardown lifecycle itself
      # (its own throwaway `--env-file`, separate from the `.env` seeded
      # above) and asserts all 8 components reach running/healthy.
      - name: Compose smoke test
        run: uv run pytest tests/integration/test_compose_smoke.py -v

  # ── Release gate: secret scanning + credential-file check ────────────────
  # EPA task W5.4 (READY-010, P0.8). Before this job the repo had no
  # automated secret detection: the 2026-08-25 residue scan (A3) was a
  # one-off run of a binary downloaded by hand, which catches what exists
  # today and nothing that lands tomorrow.
  #
  # gitleaks is pinned by version AND by sha256. An unpinned `curl | tar`
  # in a job whose whole purpose is supply-chain hygiene would be a joke at
  # its own expense; `gitleaks-action` is deliberately not used because it
  # requires a licence key for organisation accounts.
  #
  # Historical findings are baselined in .gitleaksignore (fingerprints, no
  # values). The tree scan is therefore green on arrival and any NEW finding
  # is a real one. On pull requests the job additionally scans the commits
  # the PR introduces, which catches a secret that was added and then
  # deleted again within the branch — invisible to a tree scan.
  security:
    name: security (secret scan, credential-file gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          # Full history: the pull-request diff scan below needs the base
          # commit, and a shallow clone does not have it.
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          tar xzf "$asset" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan — working tree
        run: |
          gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Secret scan — commits introduced by this pull request
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"

      # Mode `tracked`, not `host`: actions/checkout rewrites every file to
      # 0644, so a permission check on a CI checkout would flag the entire
      # tree and prove nothing. The question CI *can* answer is whether a
      # credential-shaped file is committed at all. The on-disk permission
      # sweep runs on the ops host from /etc/cron.d/crawmatic-dr.
      - name: Credential-file gate (tracked files)
        run: ./scripts/security/check_file_permissions.sh --mode tracked --root .
