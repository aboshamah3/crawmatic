# Brings up all eight components of the skeleton (plan.md, contracts/service-topology.md).
#
# Exposure (FR-013, SC-005): only `api` publishes a host port in this
# phase (`ports:`); every other service uses `expose:` only (internal
# network). Phase 4 (US2) further hardens/verifies this boundary.
#
# DB routing (FR-011, SC-003): app services reach Postgres only through
# `pgbouncer:6432`; DATABASE_URL in `.env` must never target
# `postgres:5432` directly.
#
# API port (analyze I1): API_PORT is the single canonical port variable.
# `PORT` on the `api` service is derived from it (`environment: PORT:
# ${API_PORT}`), and the published host port uses the same value, so
# host / container-listen / healthcheck ports never diverge.

services:
  postgres:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: ${PGBOUNCER_POOL_MODE}
      AUTH_TYPE: ${PGBOUNCER_AUTH_TYPE}
      LISTEN_ADDR: ${PGBOUNCER_LISTEN_ADDR}
      LISTEN_PORT: "6432"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "6432"
    # Production-readiness audit §11 ("meaningful healthchecks" — only
    # postgres/api had one). No Postgres client tooling is guaranteed in
    # this Alpine-based image, so this is a bare TCP-accept probe via
    # busybox ash's `/dev/tcp` (enabled by default on Alpine's busybox
    # build) rather than a real `SELECT 1` — it proves the listener is up
    # and accepting connections, not that auth/pooling is healthy.
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/6432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.2-bookworm
    # Audit §6/§11/§12 (Redis is broker + correctness-critical
    # locks/counters/budget state, with no enforced eviction policy or
    # persistence): `noeviction` so a full Redis returns OOM errors to
    # callers instead of silently discarding rate-limit/budget/dedup
    # keys under memory pressure (an eviction would look like every
    # brake releasing at once, not like an error). `--appendonly yes` +
    # a named volume so broker/lock/counter state survives a container
    # restart instead of resetting to empty. This is the compose-level
    # piece only — the *application* fail-closed behavior when Redis is
    # unavailable/full (H2/H3 workstream) is separate and not touched
    # here.
    #
    # AUTH (pre-launch audit, LOW): Redis holds the broker, the
    # distributed locks, the spend counters and the dispatch idempotency
    # keys — anyone who can reach it can release every brake in the
    # system. It listens with no password at all. REDIS_PASSWORD wires
    # `requirepass` through without breaking local-dev ergonomics: an
    # EMPTY value (the .env.example default, matching PGBOUNCER_AUTH_TYPE
    # =trust's local-only posture) starts Redis exactly as before, and any
    # non-empty value is enforced. Compose interpolates `${REDIS_PASSWORD
    # :+...}` at config time, so the flag is either present or absent —
    # never `--requirepass ""` — while the value itself is expanded by the
    # container's own shell (`$$`), so a password containing spaces or
    # shell metacharacters survives intact.
    #
    # A password here MUST be matched in REDIS_URL
    # (redis://:<password>@redis:6379/0) — that is the only thing every
    # app service reads.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - >-
        exec redis-server --maxmemory-policy noeviction --appendonly yes
        ${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    # Real semantic check (redis-cli PING -> PONG), not just TCP accept.
    # Authenticates when (and only when) a password is configured.
    healthcheck:
      test:
        - "CMD-SHELL"
        - redis-cli ${REDIS_PASSWORD:+--no-auth-warning -a "$$REDIS_PASSWORD"} ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      PORT: ${API_PORT}
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      pgbouncer:
        condition: service_started
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ['PORT'] + '/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-shot Alembic migration job (SPEC-02 US1, contracts/migration-job.md):
  # connects DIRECTLY to postgres:5432 via MIGRATION_DATABASE_URL (never the
  # pgbouncer:6432 pooler — advisory locks / concurrent index builds are
  # unsafe under transaction pooling). `restart: "no"` — it runs once and
  # exits; it is never a long-running service. No app service (api/
  # scheduler/worker) runs migrations at startup; they only depend on
  # pgbouncer. Run explicitly via `docker compose run --rm migrate`.
  migrate:
    # One-shot migration job. Gated behind the "migrate" profile so a plain
    # `docker compose up` does NOT start it (keeps the default stack at the 8
    # long-running services and runs migrations only when explicitly invoked,
    # e.g. `docker compose run --rm migrate` or `docker compose --profile migrate up`).
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: apps/migrate/Dockerfile
    env_file: .env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: apps/scheduler/Dockerfile
    env_file: .env
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
    # Best-effort liveness only: the scheduler exposes no port and no
    # CLI/heartbeat hook, so this can only confirm the app module still
    # imports cleanly inside the running container (catches a
    # crash-looping/broken deploy) — it does NOT confirm the poll loop
    # (SCHEDULER_POLL_INTERVAL_SECONDS) is still actually ticking. A real
    # liveness probe needs an application-level heartbeat (e.g. a
    # periodically-touched file or a tiny status endpoint) — that's an
    # apps/scheduler code change, out of this change's scope; see the
    # handoff note in the accompanying report.
    healthcheck:
      test: ["CMD", "python3", "-c", "import app.scheduler.scheduler_app"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    env_file: .env
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
    # Real semantic check: `celery inspect ping` round-trips through the
    # broker to the running worker process and back, not just "the
    # container is up."
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping", "-t", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  scrapers:
    build:
      context: .
      dockerfile: apps/scrapers/Dockerfile
    env_file: .env
    environment:
      SCRAPYD_USERNAME: ${SCRAPYD_USERNAME}
      SCRAPYD_PASSWORD: ${SCRAPYD_PASSWORD}
    expose:
      - "6800"
    # Real semantic check against Scrapyd's own status endpoint (the
    # same one README's manual "Authenticated request succeeds" curl
    # exercises), not just TCP accept.
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import base64, os, urllib.request; req = urllib.request.Request('http://localhost:6800/daemonstatus.json', headers={'Authorization': 'Basic ' + base64.b64encode((os.environ['SCRAPYD_USERNAME'] + ':' + os.environ['SCRAPYD_PASSWORD']).encode()).decode()}); urllib.request.urlopen(req, timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  scrapers-browser:
    build:
      context: .
      dockerfile: apps/scrapers-browser/Dockerfile
    env_file: .env
    environment:
      SCRAPYD_USERNAME: ${SCRAPYD_USERNAME}
      SCRAPYD_PASSWORD: ${SCRAPYD_PASSWORD}
    expose:
      - "6800"
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import base64, os, urllib.request; req = urllib.request.Request('http://localhost:6800/daemonstatus.json', headers={'Authorization': 'Basic ' + base64.b64encode((os.environ['SCRAPYD_USERNAME'] + ':' + os.environ['SCRAPYD_PASSWORD']).encode()).decode()}); urllib.request.urlopen(req, timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
