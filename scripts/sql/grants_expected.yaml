# scripts/sql/grants_expected.yaml -- component-scoped DB grants manifest
# (EPA plan-core-production-readiness-2026-09-07, A3/F03).
#
# The explicit-privilege half of the pair `scripts/provision_db_roles.sql`
# (the DDL that applies these exact grants) and `scripts/verify_grants.py`
# (which diffs a live database's `information_schema.role_table_grants`
# against this file and exits 2 on drift). `tests/unit/
# test_grants_manifest_schema.py` asserts every table in
# `scripts/rls_table_manifest.txt` appears exactly once per role below,
# always as an explicit privilege list -- never an implicit `ALL`, and
# never a missing/omitted table (an omission is exactly as unreviewed as
# an implicit `ALL` grant would be).
#
# THREE ROLES
# -----------
#   crawmatic_app      The ordinary tenant connection (API/worker/
#                       scheduler). NOBYPASSRLS -- every read/write is
#                       filtered by the per-transaction `app.workspace_id`
#                       GUC.
#   crawmatic_auth      BYPASSRLS. The narrow system seam: pre-auth
#                       credential lookup, the SaaS admin control plane,
#                       and cross-tenant maintenance/scheduler scans.
#   crawmatic_scraper   NEW (this task). NOBYPASSRLS. The scrapyd
#                       services' narrow ingestion role -- write access to
#                       exactly the fleet-ingestion columns a spider run
#                       produces, read access to the profile/match data it
#                       needs to know what and how to scrape, nothing on
#                       budgets/entitlements/users. Not yet wired into any
#                       deployed service's DATABASE_URL -- that DSN
#                       cutover is owner work tracked as A10
#                       (`docs/ops/SECRETS_BY_COMPONENT.md`).
#
# `network_operations` IS DELIBERATELY NOT FULLY CLOSED FOR crawmatic_app
# OR crawmatic_auth. This file's per-table comments (generated from a
# code audit; see the generator's inline notes preserved below) record
# two evidenced exceptions to the plan's literal "tenant roles read
# workspace_usage_v, never the table" / "crawmatic_auth: no SELECT
# network_operations" language:
#
#   * `apps/api/app/services/admin_usage.py` joins `NetworkOperation`
#     directly on the ordinary crawmatic_app session for the admin usage
#     report -- SELECT is kept for crawmatic_app.
#   * `app_shared.netledger.recorder`'s open/close/replay path runs on
#     `get_system_session` (crawmatic_auth) and issues real
#     `SELECT ... FROM network_operations` statements -- SELECT is kept
#     for crawmatic_auth (in addition to the INSERT/UPDATE it already
#     needs to open and close a ledger row).
#
# Fully closing either would break a live code path that is out of this
# packet's file scope to migrate onto the new `workspace_usage_v` view.
# See the A3 task report's Escalation section for the tracked follow-up.
#
# Every other table/role narrowing below (fleet tables lose UPDATE for
# crawmatic_app; identity tables are SELECT-only for crawmatic_auth
# except the evidenced `refresh_tokens` write-path exception; `products`
# loses UPDATE for crawmatic_auth; crawmatic_scraper's five named grants)
# was checked against an actual code audit of every writer this task
# could find for the affected tables -- not asserted from the plan text
# alone.
