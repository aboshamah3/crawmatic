[project]
name = "scrape_core"
version = "0.1.0"
description = "Shared scraping-side library imported by both Scrapyd app members. May depend on app_shared; app_shared must never depend on this package."
requires-python = ">=3.13,<3.14"
dependencies = [
    "app_shared",
    "parsel>=1.11,<2",
    "twisted>=24.3,<27",
    # >=2.16 specifically: `scrape_core.impersonate` implements the
    # coroutine download-handler API (`async def download_request(request)`
    # / `async def close()`), which 2.13-2.15 do not call that way.
    "scrapy>=2.16,<3",
    # Chrome TLS-fingerprint impersonation for the amazon.sa/noon.com
    # download path (scrape_core.impersonate).
    "curl_cffi>=0.7,<1",
    # A2/F02: the ONLY regex engine allowed to run DB-supplied
    # `price_regex`/`old_price_regex`/`currency_regex`/`stock_regex` on the
    # live path. CPython's stdlib `re` cannot be interrupted mid-match, so a
    # catastrophic backtrack on customer-supplied text pins a scraper core
    # forever; `regex` accepts a `timeout=` on `search()` and raises
    # `TimeoutError` instead. See `scrape_core.extraction.regex`.
    "regex>=2024.11",
]

[tool.uv.sources]
app_shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrape_core"]
